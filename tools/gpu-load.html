<!doctype html><html><body style="margin:0;background:#000;overflow:hidden"><canvas id=c style="width:100vw;height:100vh"></canvas><script>
// A deliberately heavy shader so the GPU (not vsync) limits fps, like a demanding game.
const c=document.getElementById('c');c.width=1920;c.height=1080;
const gl=c.getContext('webgl2');
const vs=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fs=`#version 300 es
precision highp float;uniform float t;uniform int iters;out vec4 o;
void main(){vec2 uv=gl_FragCoord.xy/vec2(1920.,1080.);vec3 col=vec3(0);
for(int i=0;i<iters;i++){float f=float(i);uv=fract(uv*1.01+vec2(sin(t+f*.1),cos(t*.7+f*.13))*.01);col+=vec3(uv,sin(t+f))*.002;}
o=vec4(col,1);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
const ut=gl.getUniformLocation(pr,'t'),ui=gl.getUniformLocation(pr,'iters');
window.iters=400;let frames=0;
function draw(t){gl.uniform1f(ut,t/1000);gl.uniform1i(ui,window.iters);gl.drawArrays(gl.TRIANGLES,0,3);frames++;requestAnimationFrame(draw)}
requestAnimationFrame(draw);
window.measure=(ms)=>new Promise(r=>{const f0=frames,t0=performance.now();setTimeout(()=>r(+((frames-f0)/((performance.now()-t0)/1000)).toFixed(1)),ms)});
</script></body></html>
