[package]
name = "replay-buffer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri-winrt-notification = "0.8.1"
toml = "1.2.0"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_Media", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_Media_Audio", "Win32_Graphics_Direct3D_Fxc", "Win32_UI_HiDpi", "Win32_Devices_FunctionDiscovery", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Networking_WinSock", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader"] }

[build-dependencies]
cc = "1.11.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
